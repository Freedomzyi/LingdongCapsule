name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test and publish self-contained Windows x64
        shell: pwsh
        run: ./scripts/build.ps1 -RequireClean
      - name: Verify extracted package installer and local runtime
        shell: powershell
        run: ./scripts/test-published.ps1 -RequireClean
      - name: Verify bundled themes and widgets
        shell: pwsh
        run: dotnet run --project tests/Capsule.WindowsTests -c Release --no-build -- --collection-test
      - name: Verify standalone setup and real maintenance lifecycle
        shell: pwsh
        run: |
          dotnet run --project tests/Capsule.WindowsTests -c Release --no-build -- --setup-payload-test
          if ($LASTEXITCODE -ne 0) { throw 'Payload guards failed' }
          dotnet run --project tests/Capsule.WindowsTests -c Release --no-build -- --setup-smoke artifacts/LingdongCapsule-Setup-win-x64.exe
          if ($LASTEXITCODE -ne 0) { throw 'Setup startup failed' }
          dotnet run --project tests/Capsule.WindowsTests -c Release --no-build -- --maintenance-real-test artifacts/app
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance lifecycle failed' }
      - name: Verify main application and onboarding in fresh runner profile
        shell: powershell
        run: ./scripts/test-published.ps1 -RequireClean -MainStartup
      - uses: actions/upload-artifact@v4
        with:
          name: LingdongCapsule-win-x64
          path: |
            artifacts/LingdongCapsule-win-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/LingdongCapsule-Setup-win-x64.exe
            artifacts/SETUP-SHA256SUMS.txt
            artifacts/SETUP-BUILD-INFO.json
            artifacts/plugins/*.zip
            artifacts/plugins/SHA256SUMS.txt
